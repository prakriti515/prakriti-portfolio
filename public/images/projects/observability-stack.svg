<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0a1024"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c1228" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad3)"/>
  
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#f43f5e" stroke-width="1">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800M0 450h800"/>
    <path d="M50 0v500M100 0v500M150 0v500M200 0v500M250 0v500M300 0v500M350 0v500M400 0v500M450 0v500M500 0v500M550 0v500M600 0v500M650 0v500M700 0v500M750 0v500"/>
  </g>

  <!-- Title / Label in corner -->
  <rect x="30" y="24" width="160" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
  <circle cx="44" cy="37" r="4" fill="#f43f5e"/>
  <text x="56" y="41" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">METRICS &amp; LOGGING</text>

  <!-- Connections -->
  <g stroke="#f97316" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 4">
    <!-- Exporters to Prometheus -->
    <path d="M210 160 H 310" />
    <path d="M210 260 H 310" />
    <path d="M210 360 H 310" />
    <!-- Prometheus to Grafana -->
    <path d="M470 200 H 560" />
    <!-- Loki to Grafana -->
    <path d="M470 320 H 560" />
    <!-- Prometheus to Alertmanager -->
    <path d="M390 260 V 400 H 560" />
  </g>

  <!-- Left: Targets & Exporters -->
  <g transform="translate(50, 110)">
    <rect width="160" height="74" rx="8" fill="url(#cardGrad3)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Node Exporter</text>
    <text x="16" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Host CPU, RAM, Disk, Net</text>
    <text x="16" y="62" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">4 Proxmox Nodes</text>
  </g>

  <g transform="translate(50, 210)">
    <rect width="160" height="74" rx="8" fill="url(#cardGrad3)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="16" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">cAdvisor / Containers</text>
    <text x="16" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Container Resource Usage</text>
    <text x="16" y="62" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">15+ Docker Containers</text>
  </g>

  <g transform="translate(50, 310)">
    <rect width="160" height="74" rx="8" fill="url(#cardGrad3)" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="16" y="28" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Promtail Log Shipper</text>
    <text x="16" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Systemd &amp; App Logs</text>
    <text x="16" y="62" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Streams to Loki</text>
  </g>

  <!-- Center: Prometheus & Loki -->
  <g transform="translate(300, 130)">
    <rect width="170" height="110" rx="10" fill="url(#cardGrad3)" stroke="#f97316" stroke-width="1.5" filter="url(#glow3)"/>
    <rect width="170" height="110" rx="10" fill="url(#cardGrad3)" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="10" fill="#f97316" fill-opacity="0.3"/>
    <text x="46" y="36" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Prometheus</text>
    <text x="16" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">TSDB • 15s Scrape Interval</text>
    <rect x="16" y="74" width="138" height="22" rx="4" fill="#431407" stroke="#ea580c"/>
    <text x="24" y="89" fill="#fdba74" font-family="system-ui, sans-serif" font-size="9" font-weight="600">PromQL Alerting Rules</text>
  </g>

  <g transform="translate(300, 270)">
    <rect width="170" height="90" rx="10" fill="url(#cardGrad3)" stroke="#eab308" stroke-width="1.2"/>
    <circle cx="28" cy="30" r="10" fill="#eab308" fill-opacity="0.3"/>
    <text x="46" y="34" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Grafana Loki</text>
    <text x="16" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">High-Efficiency Log Aggregation</text>
    <text x="16" y="75" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9">LogQL Querying &amp; Indexing</text>
  </g>

  <!-- Right: Visualization (Grafana) & Alertmanager -->
  <g transform="translate(560, 150)">
    <rect width="190" height="130" rx="12" fill="url(#cardGrad3)" stroke="#f43f5e" stroke-width="1.5" filter="url(#glow3)"/>
    <rect width="190" height="130" rx="12" fill="url(#cardGrad3)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="20" y="32" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Grafana Dashboard</text>
    <text x="20" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Unified Unified Ops View</text>
    <g transform="translate(20, 64)">
      <rect width="70" height="48" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <path d="M10 38 L25 20 L45 28 L60 10" stroke="#38bdf8" stroke-width="2" fill="none"/>
      <text x="8" y="16" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="8">Latency</text>
    </g>
    <g transform="translate(100, 64)">
      <rect width="70" height="48" rx="4" fill="#1e1b4b" stroke="#4338ca"/>
      <path d="M10 30 L25 32 L45 15 L60 22" stroke="#f43f5e" stroke-width="2" fill="none"/>
      <text x="8" y="16" fill="#fda4af" font-family="system-ui, sans-serif" font-size="8">Uptime</text>
    </g>
  </g>

  <g transform="translate(560, 360)">
    <rect width="190" height="70" rx="10" fill="url(#cardGrad3)" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="28" cy="35" r="10" fill="#ef4444" fill-opacity="0.3"/>
    <text x="46" y="32" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Alertmanager</text>
    <text x="46" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Telegram &amp; Email Alerts</text>
  </g>
</svg>
