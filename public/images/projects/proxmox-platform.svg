<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0a1024"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c1228" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#6366f1" stroke-width="1">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800M0 450h800"/>
    <path d="M50 0v500M100 0v500M150 0v500M200 0v500M250 0v500M300 0v500M350 0v500M400 0v500M450 0v500M500 0v500M550 0v500M600 0v500M650 0v500M700 0v500M750 0v500"/>
  </g>

  <!-- Title / Label in corner -->
  <rect x="30" y="24" width="130" height="26" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
  <circle cx="44" cy="37" r="4" fill="#10b981"/>
  <text x="56" y="41" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">PROXMOX VE HA</text>

  <!-- Connection Lines with Glow -->
  <g stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 4">
    <!-- Router to Nodes -->
    <path d="M400 110 V 160 H 200 V 210" />
    <path d="M400 110 V 210" />
    <path d="M400 110 V 160 H 600 V 210" />
    <!-- Nodes to Storage/Backup -->
    <path d="M200 320 V 370 H 300 V 410" />
    <path d="M400 320 V 410" />
    <path d="M600 320 V 370 H 500 V 410" />
  </g>

  <!-- Top: Router / Firewall -->
  <g transform="translate(320, 50)">
    <rect width="160" height="60" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="160" height="60" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="12" fill="#3b82f6" fill-opacity="0.2"/>
    <path d="M22 30h12m-6-6v12" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="27" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">OPNsense WAF</text>
    <text x="50" y="43" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="500">VLAN Isolation</text>
  </g>

  <!-- Node 1: Web Tier -->
  <g transform="translate(110, 210)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2"/>
    <rect x="12" y="12" width="156" height="24" rx="5" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="24" y="28" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VLAN 10 • Web Tier</text>
    <rect x="12" y="44" width="72" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Nginx-01</text>
    <text x="20" y="82" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">SSL / HTTPS</text>
    <rect x="96" y="44" width="72" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="104" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Nginx-02</text>
    <text x="104" y="82" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">Load Balance</text>
  </g>

  <!-- Node 2: App Cluster -->
  <g transform="translate(310, 210)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="12" y="12" width="156" height="24" rx="5" fill="#082f49" stroke="#0369a1" stroke-width="1"/>
    <text x="24" y="28" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VLAN 20 • App Cluster</text>
    <rect x="12" y="44" width="72" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Docker-01</text>
    <text x="20" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9">8 Services</text>
    <rect x="96" y="44" width="72" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="104" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Docker-02</text>
    <text x="104" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9">7 Services</text>
  </g>

  <!-- Node 3: DB & Storage -->
  <g transform="translate(510, 210)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="12" y="12" width="156" height="24" rx="5" fill="#064e3b" stroke="#047857" stroke-width="1"/>
    <text x="24" y="28" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VLAN 30 • Data Tier</text>
    <rect x="12" y="44" width="72" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">PostgreSQL</text>
    <text x="20" y="82" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">Replicated</text>
    <rect x="96" y="44" width="72" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="104" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Redis / MQ</text>
    <text x="104" y="82" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">In-Memory</text>
  </g>

  <!-- Bottom: Backup & Storage Systems -->
  <g transform="translate(230, 410)">
    <rect width="340" height="64" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="28" cy="32" r="12" fill="#f59e0b" fill-opacity="0.2"/>
    <path d="M22 32h12m-6-6v12" stroke="#fbbf24" stroke-width="2"/>
    <text x="50" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Proxmox Backup Server (PBS) + AWS S3 Offsite</text>
    <text x="50" y="46" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Automated Deduplicated Snapshots • RPO: 1h / RTO: 15m</text>
  </g>
</svg>
